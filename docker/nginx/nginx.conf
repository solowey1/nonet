# Single vhost for the whole Mini App (§0.4: single origin) — SPA, API, and
# the bot webhook all live behind this one host. Routing per §18:
#   /            -> static SPA
#   /api/        -> api container
#   /tg/webhook  -> bot container

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Mini Apps are iframed by Telegram's web clients — never DENY framing,
    # just scope it to Telegram's own origins (§12).
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bot-to-api only (Stars payment webhook forwarding, §13/§8) — never
    # reachable from outside this vhost. Must come before the general /api/
    # location since nginx picks the longest-matching prefix.
    location /api/internal/ {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tg/webhook {
        proxy_pass http://bot:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's hashed build assets never change content under a given URL —
    # cache them forever (§16).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (and any other unhashed root file) must always be
    # revalidated, or players get stuck on a stale shell after a deploy (§16).
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
